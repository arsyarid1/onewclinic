<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koneksi Terputus — ONEW Clinic</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            max-width: 24rem;
            width: 100%;
            padding: 2.25rem 2rem;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            letter-spacing: -0.025em;
            color: #0f172a;
        }
        p {
            font-size: 0.875rem;
            color: #64748b;
            line-height: 1.5;
            margin: 0 0 1.75rem;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem 1.25rem;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 9999px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn:hover {
            filter: brightness(0.92);
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icon.png" alt="ONEW Clinic Logo" class="logo">
        <h1>Mode Luar Jaringan (Offline)</h1>
        <p>Aplikasi ONEW Clinic saat ini tidak dapat terhubung ke server. Periksa koneksi Wi-Fi atau jaringan tablet Anda.</p>
        <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
